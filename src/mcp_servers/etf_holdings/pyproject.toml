[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-etf-holdings"
version = "0.1.0"
description = "Find which ETFs hold any stock — MCP server for ETF reverse lookup"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "vlearner", email = "" }]
keywords = ["mcp", "etf", "finance", "yfinance", "stocks", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=1.0.0",
    "yfinance>=0.2.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
mcp-etf-holdings = "mcp_etf_holdings.server:main"

[project.urls]
Homepage = "https://github.com/vlearner/mcp-etf-holdings"
Repository = "https://github.com/vlearner/mcp-etf-holdings"
Issues = "https://github.com/vlearner/mcp-etf-holdings/issues"
Changelog = "https://github.com/vlearner/mcp-etf-holdings/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_etf_holdings"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
