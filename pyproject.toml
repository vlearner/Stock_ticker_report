[project]
name = "stock-ticker-report"
version = "0.1.0"
description = "LangGraph-based conversational stock analysis agent."
requires-python = ">=3.12,<3.13"
readme = "README.md"

# Vercel installs these (uv now prioritises pyproject.toml over requirements.txt).
# Keep in sync with api/requirements.txt — only what the serverless bundle needs.
dependencies = [
    "fastapi~=0.115",
    "pydantic~=2.9",
    "yfinance~=0.2",
    "pandas~=2.2",
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
# Local development — install with: pip install -e .[dev]
dev = [
    "pydantic-settings~=2.5",
    "httpx~=0.27",
    "uvicorn[standard]~=0.30",
    "python-json-logger~=3.2",
    "langgraph>=1.0.10",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-groq>=1.0.0",
    "langsmith>=0.3.0",
    "python-telegram-bot~=21.6",
    "aiosqlite~=0.20",
]
test = [
    "pytest~=9.0.3",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov~=5.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "public*", "api*", "data*"]
