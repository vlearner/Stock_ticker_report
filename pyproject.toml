# Minimal PEP-621 project file — exists primarily for deployment tooling
# (Vercel's Python builder uses `uv lock`, which needs a pyproject.toml).
#
# Day-to-day development still uses `requirements.txt`; this file only
# mirrors the pinned versions so that `uv lock` can resolve a consistent
# environment on Vercel.

[project]
name = "stock-ticker-report"
version = "0.1.0"
description = "LangGraph-based conversational stock analysis agent."
requires-python = ">=3.12,<3.13"
readme = "README.md"

# Keep in sync with requirements.txt.  Vercel uses api/requirements.txt
# for the serverless bundle; this list tracks the full dev/runtime set.
dependencies = [
    "langgraph>=1.0.10",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-groq>=1.0.0",
    "langsmith>=0.3.0",
    "pydantic~=2.9",
    "pydantic-settings~=2.5",
    "yfinance~=0.2",
    "pandas~=2.2",
    "httpx~=0.27",
    "python-telegram-bot~=21.6",
    "aiosqlite~=0.20",
    "python-dotenv~=1.0",
    "fastapi~=0.115",
    "uvicorn[standard]~=0.30",
    "python-json-logger~=3.2",
]

[project.optional-dependencies]
test = [
    "pytest~=9.0.3",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov~=5.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "public*", "api*", "data*"]
