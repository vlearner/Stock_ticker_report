<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Ticker Report — Demo</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Stock Ticker Report <span class="muted">Demo</span></div>
    <div class="badge" id="counter" aria-live="polite">5 queries remaining</div>
  </header>

  <main class="chat" id="chat" aria-live="polite">
    <div class="bubble bot">
      Hi! Try <code>AAPL</code>, <code>AAPL vs MSFT</code>, or
      <code>news TSLA</code>.
    </div>
  </main>

  <form class="composer" id="composer" autocomplete="off">
    <textarea
      id="input"
      rows="1"
      placeholder="Ticker or question…"
      maxlength="500"
      required
    ></textarea>
    <button type="submit" id="send" aria-label="Send">Send</button>
  </form>

  <footer class="footer">
    Session resets when you close this tab. Data is indicative, not financial advice.
  </footer>

  <script src="/app.js"></script>
</body>
</html>
